name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      setup: dart run build_runner build --delete-conflicting-outputs
      coverage_excludes: "**/*.g.dart"
      min_coverage: 0
      timeout_minutes: 15

  build_apk:
    # Ensure this job only runs after `build` succeeds (`needs: build`)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Run `flutter pub get`, `dart run build_runner build --delete-conflicting-outputs`,
      # and `flutter build apk --release`
      # (pass `--dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}` if targeting a deployed backend)

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      # Upload `build/app/outputs/flutter-apk/app-release.apk` as `app-release-apk`
      # using `actions/upload-artifact@v4`

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk